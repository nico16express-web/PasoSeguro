<script>
/* ======================================================================
   INICIALIZACIÓN: db / assets / suscripciones en tiempo real
   ====================================================================== */
let unsubs = [];
function clearSubs(){ unsubs.forEach(u=>{ try{ u(); }catch(e){} }); unsubs=[]; }

function subscribeCollection(name, opts, cb){
  opts = opts || {};
  try{
    let q = APP.db.collection(name);
    if(opts.dateKey) q = q.where('dateKey','==',opts.dateKey);
    if(opts.orderBy) q = q.orderBy(opts.orderBy, opts.dir||'desc');
    if(opts.limit) q = q.limit(opts.limit);
    const unsub = q.onSnapshot((snap)=>{
      cb(snap.docs.map(d=>({id:d.id, ...d.data()})));
    }, (err)=>{
      console.error('onSnapshot '+name, err);
      if(err && err.code==='revoked'){ toast('Se perdió el acceso a los datos compartidos. Recarga la página.', 'danger'); }
    });
    unsubs.push(unsub);
  }catch(e){ console.error('subscribe '+name, e); }
}

function fullRender(){
  const active = document.activeElement;
  const activeId = active && active.id;
  const selStart = (active && typeof active.selectionStart==='number') ? active.selectionStart : null;
  renderNav();
  renderContent();
  if(activeId){
    const el = document.getElementById(activeId);
    if(el){
      el.focus();
      if(selStart!=null && el.setSelectionRange){ try{ el.setSelectionRange(selStart, selStart); }catch(e){} }
    }
  }
}

function setupSubscriptions(){
  clearSubs();
  APP._lastDateKey = todayKey();
  const tKey = APP._lastDateKey;

  subscribeCollection('estudiantes', {}, (docs)=>{
    APP.estudiantes = docs.sort((a,b)=>(a.nombre||'').localeCompare(b.nombre||'', 'es'));
    fullRender();
  });
  subscribeCollection('registros', {dateKey:tKey, orderBy:'timestamp', dir:'desc', limit:300}, (docs)=>{
    APP.registros = docs; fullRender();
  });
  subscribeCollection('retiros', {dateKey:tKey, orderBy:'timestamp', dir:'desc', limit:300}, (docs)=>{
    APP.retiros = docs; fullRender();
  });
  subscribeCollection('atrasos', {dateKey:tKey, orderBy:'timestamp', dir:'desc', limit:300}, (docs)=>{
    APP.atrasos = docs; fullRender();
  });
  subscribeCollection('visitas', {dateKey:tKey, orderBy:'horaEntrada', dir:'desc', limit:300}, (docs)=>{
    APP.visitas = docs; fullRender();
  });
  subscribeCollection('alertas', {orderBy:'timestamp', dir:'desc', limit:60}, (docs)=>{
    APP.alertas = docs; fullRender();
  });
}

// re-suscribe automáticamente si cambia el día (evita quedarse mirando "el día de ayer")
setInterval(()=>{
  if(APP.db && todayKey() !== APP._lastDateKey){ setupSubscriptions(); }
}, 60000);

/* ---- "shim" de base de datos: misma API que se usa en toda la app,
   pero respaldada por Supabase (Postgres + Realtime) en vez de Claude ---- */
let sb = null;

function makeDbShim(sbc){
  const OPS = {'==':'eq','!=':'neq','<':'lt','<=':'lte','>':'gt','>=':'gte','in':'in'};

  function docWrap(row){
    const { id, ...rest } = row;
    return { id, data: ()=> rest };
  }

  async function execSelect(state){
    let q = sbc.from(state.table).select('*');
    state.filters.forEach(f=>{ q = q[OPS[f.op] || 'eq'](f.field, f.value); });
    if(state.orderField) q = q.order(state.orderField, {ascending: state.orderDir!=='desc'});
    if(state.lim) q = q.limit(state.lim);
    const { data, error } = await q;
    if(error) throw error;
    return data || [];
  }

  function buildQuery(state){
    return {
      where(field, op, value){ return buildQuery({...state, filters:[...state.filters, {field, op, value}]}); },
      orderBy(field, dir){ return buildQuery({...state, orderField:field, orderDir:dir||'asc'}); },
      limit(n){ return buildQuery({...state, lim:n}); },
      async get(){ return { docs: (await execSelect(state)).map(docWrap) }; },
      onSnapshot(cb, errCb){
        let cancelled = false;
        const run = async ()=>{
          try{ const rows = await execSelect(state); if(!cancelled) cb({ docs: rows.map(docWrap) }); }
          catch(e){ if(errCb) errCb(e); }
        };
        run();
        const channel = sbc.channel('rt_'+state.table+'_'+Math.random().toString(36).slice(2))
          .on('postgres_changes', {event:'*', schema:'public', table:state.table}, run)
          .subscribe();
        return ()=>{ cancelled = true; sbc.removeChannel(channel); };
      },
      async add(data){
        const id = (crypto.randomUUID ? crypto.randomUUID() : ('id_'+Date.now()+Math.random().toString(36).slice(2)));
        const { error } = await sbc.from(state.table).insert({ id, ...data });
        if(error) throw error;
        return { id };
      },
      doc(id){
        return {
          async set(data){ const { error } = await sbc.from(state.table).upsert({ id, ...data }); if(error) throw error; },
          async update(data){ const { error } = await sbc.from(state.table).update(data).eq('id', id); if(error) throw error; },
          async delete(){ const { error } = await sbc.from(state.table).delete().eq('id', id); if(error) throw error; },
        };
      },
    };
  }

  return {
    collection(table){ return buildQuery({table, filters:[]}); },
    doc(path){ const [table, id] = path.split('/'); return buildQuery({table, filters:[]}).doc(id); },
  };
}

function makeAssetsShim(sbc){
  return {
    async upload(blob, opts){
      const type = (opts && opts.type) || 'application/octet-stream';
      const ext = type==='image/png' ? 'png' : (type==='image/jpeg' ? 'jpg' : 'bin');
      const path = 'u_'+Date.now()+'_'+Math.random().toString(36).slice(2)+'.'+ext;
      const { error } = await sbc.storage.from('fotos').upload(path, blob, { contentType: type });
      if(error) throw error;
      const { data } = sbc.storage.from('fotos').getPublicUrl(path);
      return { id: data.publicUrl };
    },
  };
}

function makeDownloadsShim(){
  return {
    async save({filename, data}){
      const blob = (data instanceof Blob) ? data : new Blob([data], {type:'text/csv;charset=utf-8;'});
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = filename;
      document.body.appendChild(a); a.click();
      setTimeout(()=>{ a.remove(); URL.revokeObjectURL(url); }, 1500);
      return { ok:true };
    },
  };
}

/* ---- pantalla de acceso (login / crear cuenta) ---- */
function renderAuthScreen(mode, notice){
  mode = mode || 'login';
  const mnav = document.getElementById('mobile-nav'); if(mnav) mnav.style.display='none';
  document.getElementById('app').innerHTML =
    '<div style="min-height:100vh;width:100%;display:flex;align-items:center;justify-content:center;background:var(--bg);padding:20px;">'
    +'<div class="panel" style="max-width:380px;width:100%;">'
      +'<div style="display:flex;align-items:center;gap:10px;margin-bottom:16px;">'
        +'<img src="'+LOGO_DATA_URI+'" style="width:42px;height:42px;">'
        +'<div><b style="font-family:var(--font-head);font-size:16px;">PasoSeguro EBM</b><div style="font-size:12px;color:var(--ink-soft);">Escuela Básica Mulchén</div></div>'
      +'</div>'
      +(notice ? '<div class="alert-box navy"><span class="ic">&#8505;</span><div>'+escapeHtml(notice)+'</div></div>' : '')
      +'<div class="field"><label>Correo</label><input type="email" id="auth-email" autocomplete="username"></div>'
      +'<div class="field"><label>Contraseña</label><input type="password" id="auth-password" autocomplete="'+(mode==='signup'?'new-password':'current-password')+'"></div>'
      +(mode==='signup' ? '<div class="field"><label>Tu nombre</label><input type="text" id="auth-name"></div>' : '')
      +'<button class="btn orange block" id="auth-submit" style="margin-bottom:10px;">'+(mode==='signup'?'Crear cuenta':'Ingresar')+'</button>'
      +'<button class="btn ghost block" id="auth-toggle">'+(mode==='signup' ? '¿Ya tienes cuenta? Ingresa' : '¿Primera vez aquí? Crear cuenta')+'</button>'
      +'<p class="help-note" style="margin-top:14px;">La primera cuenta que se crea queda automáticamente como Dirección. El resto del equipo solo necesita crear su propia cuenta para quedar como Recepción.</p>'
    +'</div></div>';
  document.getElementById('auth-toggle').addEventListener('click', ()=> renderAuthScreen(mode==='signup'?'login':'signup'));
  document.getElementById('auth-submit').addEventListener('click', ()=> submitAuth(mode));
  document.getElementById('auth-password').addEventListener('keydown', (e)=>{ if(e.key==='Enter') submitAuth(mode); });
}

async function submitAuth(mode){
  const email = (document.getElementById('auth-email').value||'').trim();
  const password = document.getElementById('auth-password').value;
  if(!email || !password){ renderAuthScreen(mode, 'Ingresa tu correo y contraseña.'); return; }
  const btn = document.getElementById('auth-submit');
  btn.disabled = true; btn.textContent = 'Procesando…';
  try{
    if(mode==='signup'){
      const name = (document.getElementById('auth-name').value||'').trim();
      const { data, error } = await sb.auth.signUp({ email, password, options:{ data:{ name } } });
      if(error) throw error;
      if(!data.session){
        renderAuthScreen('login', 'Cuenta creada. Si tu proyecto tiene activada la confirmación por correo, revisa tu bandeja antes de ingresar.');
        return;
      }
    } else {
      const { error } = await sb.auth.signInWithPassword({ email, password });
      if(error) throw error;
    }
    location.reload();
  }catch(e){
    renderAuthScreen(mode, e.message || 'No se pudo procesar la solicitud.');
  }
}

async function afterLogin(session){
  let { data: profile } = await sb.from('profiles').select('*').eq('id', session.user.id).maybeSingle();
  if(!profile){
    const name = (session.user.user_metadata && session.user.user_metadata.name) || session.user.email;
    await sb.from('profiles').insert({ id: session.user.id, email: session.user.email, name, role:'recepcion' });
    try{ await sb.rpc('claim_direccion'); }catch(e){ console.error(e); }
    const r = await sb.from('profiles').select('*').eq('id', session.user.id).maybeSingle();
    profile = r.data;
  }
  APP.profile = profile;
  APP.role = (profile && profile.role==='direccion') ? 'direccion' : 'recepcion';
  if(!APP.funcionario && profile){
    APP.funcionario = profile.name || profile.email;
    localStorage.setItem('pasoseguro_funcionario', APP.funcionario);
  }
  APP.db = makeDbShim(sb);
  APP.assets = makeAssetsShim(sb);
  APP.downloads = makeDownloadsShim();
  APP.dbReady = true;

  renderNav();
  renderContent();
  tickClock();
  setupSubscriptions();
}

async function cerrarSesion(){
  try{ if(sb) await sb.auth.signOut(); }catch(e){ console.error(e); }
  location.reload();
}

async function initApp(){
  if(!window.SUPABASE_URL || !window.SUPABASE_ANON_KEY || window.SUPABASE_URL.indexOf('TU-PROYECTO')>-1){
    document.body.innerHTML = '<div style="max-width:520px;margin:60px auto;padding:20px;font-family:system-ui,sans-serif;">'
      +'<h2>Falta configurar Supabase</h2>'
      +'<p>Edita el archivo <b>config.js</b> de este proyecto y reemplaza <code>SUPABASE_URL</code> y <code>SUPABASE_ANON_KEY</code> por los datos de tu propio proyecto (Supabase → Configuración del proyecto → API). Revisa el README para el resto de los pasos (crear las tablas y el bucket de fotos).</p></div>';
    return;
  }
  sb = window.supabase.createClient(window.SUPABASE_URL, window.SUPABASE_ANON_KEY);

  sb.auth.onAuthStateChange((event)=>{ if(event === 'SIGNED_OUT'){ location.reload(); } });

  const { data: { session } } = await sb.auth.getSession();
  if(!session){ renderAuthScreen('login'); return; }
  await afterLogin(session);
}

initApp();
</script>

<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>PasoSeguro EBM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.0.3/qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<style>
/* ============ TOKENS ============ */
:root{
  --navy-900:#06213f;
  --navy-800:#0a3668;
  --navy-700:#153f78;
  --navy-600:#1f4f8f;
  --navy-100:#e9f0f9;
  --navy-050:#f4f7fc;
  --orange-700:#c96b12;
  --orange-600:#e07b1a;
  --orange-500:#f0932b;
  --orange-100:#fdecd6;
  --white:#ffffff;
  --ink:#132033;
  --ink-soft:#5b6b82;
  --line:#d7e0ec;
  --bg:#f2f5fa;
  --panel:#ffffff;
  --danger:#b3261e;
  --danger-bg:#fdeaea;
  --danger-line:#f1c2c0;
  --success:#1f7a4d;
  --success-bg:#e7f5ee;
  --success-line:#bfe3cf;
  --warn:#a3620a;
  --warn-bg:#fdf1de;
  --warn-line:#f0d19f;
  --radius:8px;
  --radius-sm:4px;
  --font-head:'Manrope',system-ui,-apple-system,sans-serif;
  --font-body:'Manrope',system-ui,-apple-system,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,'SFMono-Regular',monospace;
  --shadow-1:0 1px 2px rgba(10,30,60,.06);
  --shadow-2:0 6px 20px rgba(10,30,60,.10);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --white:#101826;
    --panel:#16202f;
    --ink:#eaf0f8;
    --ink-soft:#9fb0c6;
    --line:#2a394e;
    --bg:#0c1420;
    --navy-100:#182c46;
    --navy-050:#13233a;
    --orange-100:#3a2a12;
    --danger-bg:#3a1a19;
    --success-bg:#123322;
    --warn-bg:#332506;
    --shadow-1:0 1px 2px rgba(0,0,0,.4);
    --shadow-2:0 10px 30px rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"]{
  --white:#101826;
  --panel:#16202f;
  --ink:#eaf0f8;
  --ink-soft:#9fb0c6;
  --line:#2a394e;
  --bg:#0c1420;
  --navy-100:#182c46;
  --navy-050:#13233a;
  --orange-100:#3a2a12;
  --danger-bg:#3a1a19;
  --success-bg:#123322;
  --warn-bg:#332506;
  --shadow-1:0 1px 2px rgba(0,0,0,.4);
  --shadow-2:0 10px 30px rgba(0,0,0,.5);
}

*{box-sizing:border-box;}
html,body{margin:0;padding:0;height:100%;}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:var(--font-body);
  font-size:15px;
  line-height:1.45;
  -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit;}
button{cursor:pointer;}
::selection{background:var(--orange-100);}

/* ============ LAYOUT SHELL ============ */
#app{display:flex;min-height:100vh;}

.sidebar{
  width:220px;flex:0 0 220px;
  background:var(--navy-900);
  color:#eaf0f8;
  display:flex;flex-direction:column;
  position:sticky;top:0;height:100vh;
  overflow-y:auto;
}
.sidebar-brand{
  display:flex;align-items:center;gap:10px;
  padding:18px 16px 14px;
  border-bottom:1px solid rgba(255,255,255,.12);
}
.sidebar-brand img{width:38px;height:38px;object-fit:contain;flex:0 0 auto;}
.sidebar-brand .brand-text{line-height:1.2;}
.sidebar-brand .brand-text b{font-family:var(--font-head);font-weight:800;font-size:15px;display:block;color:#fff;}
.sidebar-brand .brand-text span{font-size:11px;color:#b9c8dd;letter-spacing:.02em;}

.nav-list{list-style:none;margin:0;padding:10px 10px;flex:1;}
.nav-item{
  display:flex;align-items:center;gap:11px;
  padding:10px 12px;margin-bottom:3px;
  border-radius:var(--radius-sm);
  color:#c9d6e8;
  cursor:pointer;
  font-weight:600;font-size:13.5px;
  position:relative;
  border-left:3px solid transparent;
  transition:background .12s ease, color .12s ease;
}
.nav-item:hover{background:rgba(255,255,255,.06);color:#fff;}
.nav-item.active{background:rgba(240,147,43,.14);color:#fff;border-left-color:var(--orange-500);}
.nav-item .ic{width:20px;text-align:center;font-size:16px;flex:0 0 auto;}
.nav-badge{
  margin-left:auto;background:var(--orange-500);color:#3a2200;
  font-size:11px;font-weight:800;border-radius:20px;
  padding:1px 7px;min-width:18px;text-align:center;
}
.sidebar-foot{
  padding:12px 16px 16px;
  border-top:1px solid rgba(255,255,255,.12);
  font-size:11.5px;color:#8fa3bf;
}
.sidebar-foot .funcionario-row{display:flex;gap:6px;margin-bottom:8px;}
.sidebar-foot input{
  width:100%;padding:7px 9px;border-radius:var(--radius-sm);
  border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.06);
  color:#fff;font-size:12.5px;font-weight:600;
}
.sidebar-foot input::placeholder{color:#8fa3bf;}
.db-status{display:flex;align-items:center;gap:6px;font-size:11px;}
.dot{width:7px;height:7px;border-radius:50%;background:#69c07a;flex:0 0 auto;}
.dot.off{background:#e07070;}
.dot.pending{background:#e0b060;}

.main{flex:1;min-width:0;display:flex;flex-direction:column;}
.topbar{
  display:flex;align-items:center;justify-content:space-between;
  padding:14px 24px;background:var(--panel);
  border-bottom:1px solid var(--line);
  position:sticky;top:0;z-index:20;
}
.topbar h1{font-family:var(--font-head);font-size:19px;margin:0;font-weight:800;color:var(--navy-900);}
:root[data-theme="dark"] .topbar h1, @media (prefers-color-scheme:dark){}
.topbar .sub{font-size:12.5px;color:var(--ink-soft);margin-top:2px;}
.clock{font-family:var(--mono);font-size:13px;color:var(--ink-soft);font-weight:600;text-align:right;}
.clock .d{font-size:11px;text-transform:capitalize;}

.content{flex:1;padding:22px 24px 60px;max-width:1180px;width:100%;margin:0 auto;}

/* mobile bottom nav */
.mobile-nav{display:none;}
@media (max-width:860px){
  .sidebar{display:none;}
  .mobile-nav{
    display:flex;position:fixed;bottom:0;left:0;right:0;z-index:40;
    background:var(--navy-900);border-top:1px solid rgba(255,255,255,.12);
    padding:6px 4px calc(6px + env(safe-area-inset-bottom));
  }
  .mobile-nav .nav-item{flex-direction:column;flex:1;text-align:center;gap:2px;border-left:none;border-radius:6px;padding:6px 2px;font-size:10.5px;}
  .mobile-nav .nav-item .ic{font-size:18px;}
  .mobile-nav .nav-item.active{background:rgba(240,147,43,.16);}
  .content{padding-bottom:90px;}
  .topbar{padding:12px 14px;}
  .topbar h1{font-size:16px;}
}

/* ============ COMPONENTS ============ */
.panel{
  background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
  padding:18px;margin-bottom:16px;
}
.panel-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;gap:10px;flex-wrap:wrap;}
.panel-head h2{font-family:var(--font-head);font-size:15.5px;margin:0;font-weight:800;color:var(--navy-800);}
:root[data-theme="dark"] .panel-head h2{color:#dce8fb;}
.panel-head .hint{font-size:12px;color:var(--ink-soft);font-weight:500;}

.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;}
@media (max-width:760px){.grid-2{grid-template-columns:1fr;} .grid-3{grid-template-columns:1fr 1fr;}}
@media (max-width:520px){.grid-3{grid-template-columns:1fr;}}

.stat-card{
  border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;
  background:var(--panel);border-left:4px solid var(--navy-700);
}
.stat-card .num{font-family:var(--font-head);font-size:26px;font-weight:800;color:var(--navy-900);line-height:1;}
:root[data-theme="dark"] .stat-card .num{color:#f2f6fc;}
.stat-card .lbl{font-size:12px;color:var(--ink-soft);margin-top:5px;font-weight:600;}
.stat-card.orange{border-left-color:var(--orange-500);}
.stat-card.danger{border-left-color:var(--danger);}
.stat-card.success{border-left-color:var(--success);}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  padding:9px 16px;border-radius:var(--radius-sm);border:1px solid transparent;
  font-weight:700;font-size:13.5px;background:var(--navy-800);color:#fff;
  transition:filter .12s ease, transform .05s ease;
}
.btn:hover{filter:brightness(1.08);}
.btn:active{transform:translateY(1px);}
.btn:disabled{opacity:.5;cursor:not-allowed;filter:none;}
.btn.orange{background:var(--orange-500);color:#3a2200;}
.btn.danger{background:var(--danger);color:#fff;}
.btn.success{background:var(--success);color:#fff;}
.btn.ghost{background:transparent;border-color:var(--line);color:var(--ink);}
.btn.ghost:hover{background:var(--navy-050);}
.btn.sm{padding:6px 11px;font-size:12.5px;}
.btn.block{width:100%;}

.field{margin-bottom:12px;}
.field label{display:block;font-size:12px;font-weight:700;color:var(--ink-soft);margin-bottom:5px;}
.mat-form .field label{color:var(--ink-soft);}
.mat-form h3{color:var(--ink);}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]) .mat-form .field label{color:#ffffff;}
}
:root[data-theme="dark"] .mat-form .field label{color:#ffffff;}
.field input[type=text],.field input[type=tel],.field input[type=search],.field select,.field textarea,.field input[type=file]{
  width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:var(--radius-sm);
  background:var(--panel);color:var(--ink);
}
.field input:focus,.field select:focus,.field textarea:focus{outline:2px solid var(--orange-500);outline-offset:-1px;border-color:var(--orange-500);}
.field .rut{font-family:var(--mono);}
.checkline{display:flex;align-items:flex-start;gap:8px;font-size:13px;font-weight:600;}
.checkline input{margin-top:3px;}

.badge{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:20px;font-size:11.5px;font-weight:700;}
.badge.navy{background:var(--navy-100);color:var(--navy-800);}
:root[data-theme="dark"] .badge.navy{color:#cfe0f7;}
.badge.orange{background:var(--orange-100);color:var(--orange-700);}
.badge.danger{background:var(--danger-bg);color:var(--danger);border:1px solid var(--danger-line);}
.badge.success{background:var(--success-bg);color:var(--success);border:1px solid var(--success-line);}
.badge.warn{background:var(--warn-bg);color:var(--warn);border:1px solid var(--warn-line);}

.avatar{
  width:42px;height:42px;border-radius:50%;flex:0 0 auto;
  display:flex;align-items:center;justify-content:center;
  font-family:var(--font-head);font-weight:800;font-size:14px;color:#fff;
  background:var(--navy-700);object-fit:cover;overflow:hidden;
}
.avatar.lg{width:64px;height:64px;font-size:20px;}
.avatar img{width:100%;height:100%;object-fit:cover;}

.list-row{
  display:flex;align-items:center;gap:12px;padding:11px 4px;border-bottom:1px solid var(--line);
}
.list-row:last-child{border-bottom:none;}
.list-row .grow{flex:1;min-width:0;}
.list-row .name{font-weight:700;font-size:13.5px;}
.list-row .meta{font-size:12px;color:var(--ink-soft);margin-top:1px;}
.list-row .meta .rut{font-family:var(--mono);}

.search-box{position:relative;margin-bottom:8px;}
.search-box input{width:100%;padding:11px 13px 11px 36px;border:1px solid var(--line);border-radius:var(--radius-sm);background:var(--panel);color:var(--ink);font-size:14px;}
.search-box .ic{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--ink-soft);}

.selected-card{
  border:2px solid var(--navy-700);border-radius:var(--radius);padding:16px;
  background:var(--navy-050);display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-bottom:14px;
}
.selected-card .info{flex:1;min-width:180px;}
.selected-card .info h3{margin:0 0 3px;font-family:var(--font-head);font-size:16px;font-weight:800;}
.selected-card .info .meta{font-size:12.5px;color:var(--ink-soft);}
.selected-card .info .meta .rut{font-family:var(--mono);font-weight:700;color:var(--ink);}

.alert-box{border-radius:var(--radius);padding:13px 15px;border:1px solid;margin-bottom:14px;font-size:13.5px;font-weight:600;display:flex;gap:10px;align-items:flex-start;}
.alert-box.danger{background:var(--danger-bg);border-color:var(--danger-line);color:var(--danger);}
.alert-box.warn{background:var(--warn-bg);border-color:var(--warn-line);color:var(--warn);}
.alert-box.success{background:var(--success-bg);border-color:var(--success-line);color:var(--success);}
.alert-box.navy{background:var(--navy-100);border-color:var(--navy-700);color:var(--navy-800);}
:root[data-theme="dark"] .alert-box.navy{color:#cfe0f7;}
.alert-box .ic{font-size:18px;flex:0 0 auto;line-height:1;}

.empty-state{text-align:center;padding:34px 20px;color:var(--ink-soft);}
.empty-state .ic{font-size:34px;margin-bottom:10px;}
.empty-state p{margin:4px 0 14px;font-size:13.5px;}

.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:16px;overflow-x:auto;}
.tab{padding:9px 14px;font-weight:700;font-size:13px;color:var(--ink-soft);border-bottom:2px solid transparent;white-space:nowrap;cursor:pointer;}
.tab.active{color:var(--navy-800);border-bottom-color:var(--orange-500);}
:root[data-theme="dark"] .tab.active{color:#fff;}

/* signature pad */
.sigpad-wrap{border:1.5px dashed var(--line);border-radius:var(--radius);background:var(--white);position:relative;}
.sigpad-wrap canvas{width:100%;height:160px;display:block;touch-action:none;border-radius:var(--radius);}
.sigpad-hint{position:absolute;bottom:8px;left:12px;font-size:11.5px;color:var(--ink-soft);pointer-events:none;}

/* toast */
#toast-host{position:fixed;top:16px;right:16px;z-index:200;display:flex;flex-direction:column;gap:8px;max-width:320px;}
.toast{background:var(--navy-900);color:#fff;padding:12px 15px;border-radius:var(--radius);font-size:13px;font-weight:600;box-shadow:var(--shadow-2);border-left:4px solid var(--orange-500);animation:slidein .18s ease;}
.toast.danger{border-left-color:var(--danger);}
.toast.success{border-left-color:var(--success);}
@keyframes slidein{from{opacity:0;transform:translateX(12px);}to{opacity:1;transform:none;}}

/* modal */
.modal-overlay{position:fixed;inset:0;background:rgba(6,20,40,.55);display:flex;align-items:center;justify-content:center;z-index:150;padding:16px;}
.modal{background:var(--panel);border-radius:var(--radius);max-width:460px;width:100%;max-height:88vh;overflow-y:auto;padding:20px;box-shadow:var(--shadow-2);}
.modal h3{font-family:var(--font-head);margin:0 0 12px;font-size:16px;font-weight:800;}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;}

table.data{width:100%;border-collapse:collapse;font-size:13px;}
table.data th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.03em;color:var(--ink-soft);font-weight:700;padding:0 10px 8px;border-bottom:1px solid var(--line);}
table.data td{padding:9px 10px;border-bottom:1px solid var(--line);}
table.data tr:last-child td{border-bottom:none;}
.table-wrap{overflow-x:auto;}

.ticket{
  border:2px dashed var(--orange-500);border-radius:var(--radius);padding:18px;background:var(--orange-100);
  position:relative;
}
.ticket .folio{font-family:var(--mono);font-weight:700;font-size:12px;color:var(--orange-700);}
.ticket h3{margin:6px 0 2px;font-family:var(--font-head);font-size:18px;font-weight:800;color:var(--navy-900);}
:root[data-theme="dark"] .ticket h3{color:#0c1420;}

.credential{
  border:2px solid var(--navy-800);border-radius:12px;padding:16px;background:linear-gradient(160deg,var(--navy-900),var(--navy-700));
  color:#fff;max-width:320px;
}
.credential .top{display:flex;gap:10px;align-items:center;margin-bottom:10px;}
.credential .top img{width:30px;height:30px;}
.credential .top b{font-family:var(--font-head);font-size:12.5px;letter-spacing:.02em;}
.credential .qr{background:#fff;border-radius:8px;padding:10px;display:flex;justify-content:center;margin:8px 0;}
.credential .qr svg{width:130px;height:130px;}
.credential .nombre{font-family:var(--font-head);font-weight:800;font-size:15px;}
.credential .curso{font-size:12px;color:#cfe0f7;}
.credential .rut{font-family:var(--mono);font-size:12px;color:#f0d9b8;margin-top:6px;}
.credential-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;}
.credential.print-card{max-width:none;width:100%;page-break-inside:avoid;break-inside:avoid;}
@media print{
  .credential-grid{grid-template-columns:repeat(2,1fr);}
}

.restriccion-banner{
  background:var(--danger-bg);border:2px solid var(--danger);border-radius:var(--radius);
  padding:16px;margin-bottom:14px;
}
.restriccion-banner h4{margin:0 0 6px;color:var(--danger);font-family:var(--font-head);font-size:15px;}
.restriccion-banner p{margin:0 0 10px;font-size:13.5px;color:var(--ink);}

.pill-select{display:flex;gap:6px;flex-wrap:wrap;}
.pill-select .pill{padding:7px 13px;border-radius:20px;border:1.5px solid var(--line);font-weight:700;font-size:12.5px;cursor:pointer;}
.pill-select .pill.active{background:var(--navy-800);border-color:var(--navy-800);color:#fff;}

.scanner-input{
  display:flex;align-items:center;gap:10px;background:var(--navy-900);border-radius:var(--radius);padding:12px 14px;margin-bottom:14px;flex-wrap:wrap;
}
.scanner-input .ic{font-size:22px;}
.scanner-input input{
  flex:1 1 220px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.2);border-radius:var(--radius-sm);
  padding:9px 11px;color:#fff;font-family:var(--mono);font-size:14px;
}
.scanner-input input::placeholder{color:#9fb0c6;}
.scanner-input .lbl{color:#cfe0f7;font-size:12px;font-weight:700;}

.help-note{font-size:12px;color:var(--ink-soft);margin-top:6px;}
.divider{height:1px;background:var(--line);margin:16px 0;}

.photo-input-row{display:flex;align-items:center;gap:12px;}
.photo-preview{width:56px;height:56px;border-radius:8px;object-fit:cover;background:var(--navy-050);border:1px solid var(--line);flex:0 0 auto;}

@media print{
  body *{visibility:hidden;}
  #print-area, #print-area *{visibility:visible;}
  #print-area{position:absolute;top:0;left:0;width:100%;}
}
</style>
</head>
<body>

<div id="app">
  <nav class="sidebar" id="sidebar"></nav>
  <div class="main">
    <div class="topbar">
      <div>
        <h1 id="page-title">Inicio</h1>
        <div class="sub" id="page-sub">Escuela Básica Mulchén</div>
      </div>
      <div class="clock">
        <div id="clock-time">--:--</div>
        <div class="d" id="clock-date">--</div>
      </div>
    </div>
    <div class="content" id="content"></div>
  </div>
</div>
<nav class="mobile-nav" id="mobile-nav"></nav>
<div id="toast-host"></div>
<div id="modal-host"></div>

<script>
/* =======================================================================
   PasoSeguro EBM — Control de acceso y asistencia
   Escuela Básica Mulchén
   ======================================================================= */

const APP = {
  db: null,
  assets: null,
  downloads: null,
  userNS: null,
  role: 'recepcion', // 'recepcion' | 'direccion' — calculado desde los permisos reales de Claude
  dbReady: false,
  funcionario: localStorage.getItem('pasoseguro_funcionario') || '',
  route: 'inicio',
  estudiantes: [],
  registros: [],
  retiros: [],
  atrasos: [],
  visitas: [],
  alertas: [],
  selected: { asistencia: null, retiros: null, atrasos: null },
  seeded: null,
};

const HORARIO_ENTRADA_LIMITE = "08:15"; // después de esto se considera atraso

function todayKey(d){
  d = d || new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function nowISO(){ return new Date().toISOString(); }
function fmtTime(iso){
  try{ return new Date(iso).toLocaleTimeString('es-CL',{hour:'2-digit',minute:'2-digit'}); }catch(e){ return '--:--'; }
}
function fmtDateTime(iso){
  try{ return new Date(iso).toLocaleString('es-CL',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}); }catch(e){ return '--'; }
}
function normalizeRut(v){
  return (v||'').toString().trim().toUpperCase().replace(/\s+/g,'').replace(/\.+/g,'');
}
function initials(name){
  const parts = (name||'?').trim().split(/\s+/);
  return ((parts[0]||'')[0]||'?').toUpperCase() + ((parts[1]||'')[0]||'').toUpperCase();
}
function escapeHtml(s){
  return (s==null?'':String(s)).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function uid(prefix){
  return (prefix||'id')+'_'+Date.now().toString(36)+Math.random().toString(36).slice(2,7);
}

function toast(msg, kind){
  const host = document.getElementById('toast-host');
  const el = document.createElement('div');
  el.className = 'toast'+(kind?(' '+kind):'');
  el.textContent = msg;
  host.appendChild(el);
  setTimeout(()=>{ el.style.transition='opacity .25s ease'; el.style.opacity='0'; setTimeout(()=>el.remove(),250); }, 3200);
}

function openModal(html){
  const host = document.getElementById('modal-host');
  host.innerHTML = '<div class="modal-overlay" id="modal-overlay"><div class="modal">'+html+'</div></div>';
  document.getElementById('modal-overlay').addEventListener('click', (e)=>{ if(e.target.id==='modal-overlay') closeModal(); });
}
function closeModal(){
  if(typeof camStream!=='undefined' && camStream){ camStream.getTracks().forEach(t=>t.stop()); camStream=null; }
  if(typeof camRAF!=='undefined' && camRAF){ cancelAnimationFrame(camRAF); camRAF=null; }
  document.getElementById('modal-host').innerHTML='';
}

/* ============ NAV ============ */
const NAV_ITEMS = [
  {id:'inicio', ic:'&#127968;', label:'Inicio'},
  {id:'matricula', ic:'&#128221;', label:'Matrícula'},
  {id:'estudiantes', ic:'&#127891;', label:'Estudiantes'},
  {id:'asistencia', ic:'&#128274;', label:'Asistencia'},
  {id:'retiros', ic:'&#128118;', label:'Retiros'},
  {id:'atrasos', ic:'&#9200;', label:'Atrasos'},
  {id:'visitas', ic:'&#128100;', label:'Visitas'},
  {id:'reportes', ic:'&#128202;', label:'Reportes'},
];

function renderNav(){
  const alertasNoLeidas = APP.alertas.filter(a=>!a.leida).length;
  function itemHtml(it, mobile){
    const badge = (it.id==='inicio' && alertasNoLeidas>0) ? '<span class="nav-badge">'+alertasNoLeidas+'</span>' : '';
    return '<li class="nav-item'+(APP.route===it.id?' active':'')+'" data-route="'+it.id+'">'
      +'<span class="ic">'+it.ic+'</span><span>'+it.label+'</span>'+badge+'</li>';
  }
  const sidebar = document.getElementById('sidebar');
  sidebar.innerHTML = ''
    +'<div class="sidebar-brand"><img src="'+LOGO_DATA_URI+'" alt="Escudo"><div class="brand-text"><b>PasoSeguro EBM</b><span>Control de acceso</span></div></div>'
    +'<ul class="nav-list">'+NAV_ITEMS.map(it=>itemHtml(it,false)).join('')+'</ul>'
    +'<div class="sidebar-foot">'
      +'<div class="badge '+(APP.role==='direccion'?'orange':'navy')+'" style="margin-bottom:9px;" title="Asignado por Dirección desde el rol de tu cuenta. La primera cuenta creada queda como Dirección.">'
        +(APP.role==='direccion'?'&#127970; Rol: Dirección':'&#128100; Rol: Recepción')
      +'</div>'
      +'<div class="funcionario-row"><input id="funcionario-input" type="text" placeholder="Tu nombre (funcionario/a)" value="'+escapeHtml(APP.funcionario)+'"></div>'
      +'<div class="db-status" style="margin-bottom:8px;"><span class="dot '+(APP.dbReady?'':'pending')+'" id="db-dot"></span><span id="db-status-text">'+(APP.dbReady?'Datos sincronizados':'Conectando…')+'</span></div>'
      +(APP.profile ? '<div class="hint" style="font-size:11px;margin-bottom:6px;word-break:break-all;">'+escapeHtml(APP.profile.email||'')+'</div>' : '')

const PAGE_META = {
  inicio:{title:'Inicio', sub:'Resumen del día · Escuela Básica Mulchén'},
  asistencia:{title:'Asistencia', sub:'Registro de entradas y salidas'},
  retiros:{title:'Retiros anticipados', sub:'Verificación de apoderados y firma digital'},
  atrasos:{title:'Atrasos', sub:'Tickets digitales de atraso'},
  visitas:{title:'Visitas y proveedores', sub:'Control de acceso de externos'},
  estudiantes:{title:'Estudiantes', sub:'Fichas, apoderados y credenciales'},
  matricula:{title:'Matrícula', sub:'Ficha de matrícula e impresión'},
  reportes:{title:'Reportes y Exportación', sub:'Estadísticas, respaldo y descarga de datos'},
};

function navigate(route){
  APP.route = route;
  document.getElementById('page-title').textContent = PAGE_META[route].title;
  document.getElementById('page-sub').textContent = PAGE_META[route].sub;
  renderNav();
  renderContent();
  window.scrollTo({top:0,behavior:'instant'});
}

function requireFuncionario(){
  if(!APP.funcionario){
    toast('Ingresa tu nombre de funcionario/a en el panel lateral antes de registrar acciones.', 'danger');
    const el = document.getElementById('funcionario-input');
    if(el) el.focus();
    return false;
  }
  return true;
}

/* ============ CLOCK ============ */
function tickClock(){
  const now = new Date();
  document.getElementById('clock-time').textContent = now.toLocaleTimeString('es-CL',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
  document.getElementById('clock-date').textContent = now.toLocaleDateString('es-CL',{weekday:'long', day:'2-digit', month:'long'});
}
setInterval(tickClock, 1000);

/* ============ RENDER DISPATCH ============ */
function renderContent(){
  const c = document.getElementById('content');
  if(APP.route==='inicio') c.innerHTML = renderInicio();
  else if(APP.route==='asistencia') c.innerHTML = renderAsistencia();
  else if(APP.route==='retiros') c.innerHTML = renderRetiros();
  else if(APP.route==='atrasos') c.innerHTML = renderAtrasos();
  else if(APP.route==='visitas') c.innerHTML = renderVisitas();
  else if(APP.route==='estudiantes') c.innerHTML = renderEstudiantes();
  else if(APP.route==='reportes') c.innerHTML = renderReportes();
  else if(APP.route==='matricula') c.innerHTML = renderMatricula();
  wireRouteEvents();
}

function renderSelectedStudentCard(sel, modulo){
  return '<div class="selected-card">'
    + avatarHtml(sel, 'lg')

    + '<div class="meta"><span class="rut">'+escapeHtml(sel.rut)+'</span> · '+escapeHtml(sel.curso||'Sin curso')+'</div></div>'
    + (sel.restriccionRetiro ? '<span class="badge danger">Restricción de retiro</span>' : '')
    + '</div>';

function avatarHtml(est, size){
  const cls = 'avatar'+(size==='lg'?' lg':'');
  if(est.fotoId){
    return '<div class="'+cls+'"><img src="'+est.fotoId+'" alt=""></div>';
  }
  const hue = hashHue(est.nombre||est.rut||'?');
  return '<div class="'+cls+'" style="background:'+hue+';">'+initials(est.nombre)+'</div>';
}
function hashHue(str){
  let h=0; for(let i=0;i<str.length;i++){ h = (h*31 + str.charCodeAt(i))>>>0; }
  const palette = ['#153f78','#1f4f8f','#c96b12','#3a6b4d','#7a4a9c','#0a3668'];
  return palette[h % palette.length];
}

function matchEstudiante(q){
  q = (q||'').trim().toLowerCase();
  if(!q) return [];
  return APP.estudiantes.filter(e=>{
    return (e.nombre||'').toLowerCase().includes(q)
      || normalizeRut(e.rut).toLowerCase().includes(q.replace(/\./g,''))
      || (e.curso||'').toLowerCase().includes(q)
      || (e.codigo||'').toLowerCase()===q;
  }).slice(0,8);
}

function renderSearchResults(list, modulo){

    + (e.restriccionRetiro?'<span class="badge danger">Restricción</span>':'')
    + '</div>'
  )).join('')+'</div>';
}

function findEstudianteByCode(code){
  code = (code||'').trim();
  if(!code) return null;
  const norm = normalizeRut(code);
  return APP.estudiantes.find(e=> e.codigo && e.codigo.toUpperCase()===code.toUpperCase())
      || APP.estudiantes.find(e=> normalizeRut(e.rut)===norm);
}

/* ---- Escaneo por cámara (alternativa sin lector físico) ---- */
let jsQRLoading = false;
let camStream = null;
let camRAF = null;

function loadJsQR(){
  return new Promise((resolve, reject)=>{
    if(window.jsQR){ resolve(); return; }
    if(jsQRLoading){
      const check = setInterval(()=>{ if(window.jsQR){ clearInterval(check); resolve(); } }, 100);
      setTimeout(()=>{ clearInterval(check); if(!window.jsQR) reject(new Error('timeout')); }, 8000);
      return;
    }
    jsQRLoading = true;
    const s = document.createElement('script');
    s.src = 'https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js';
    s.onload = ()=> window.jsQR ? resolve() : reject(new Error('jsQR no disponible'));
    s.onerror = ()=> reject(new Error('No se pudo cargar la librería de escaneo'));
    document.head.appendChild(s);
  });
}

async function abrirEscanerCamara(){
  openModal(
    '<h3>Escanear con cámara</h3>'
    +'<div style="position:relative;background:#000;border-radius:8px;overflow:hidden;">'
    +'<video id="cam-video" playsinline autoplay muted style="width:100%;display:block;"></video>'
    +'</div>'
    +'<canvas id="cam-canvas" style="display:none;"></canvas>'
    +'<p class="help-note" id="cam-status">Solicitando acceso a la cámara…</p>'
    +'<div class="modal-actions"><button class="btn ghost" id="cam-cancelar">Cancelar</button></div>'
  );
  document.getElementById('cam-cancelar').addEventListener('click', closeModal);

  try{
    await loadJsQR();
  }catch(e){
    const st = document.getElementById('cam-status');
    if(st) st.textContent = 'No se pudo cargar el lector de códigos en este dispositivo. Usa el campo de texto o un lector físico.';
    return;
  }

  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    const st = document.getElementById('cam-status');
    if(st) st.textContent = 'Este navegador no permite acceso a la cámara aquí. Usa el campo de texto o un lector físico.';
    return;
  }

  try{
    camStream = await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});
  }catch(e){
    const st = document.getElementById('cam-status');
    if(st) st.textContent = 'No se pudo acceder a la cámara (permiso denegado o no disponible). Usa el campo de texto o un lector físico.';
    return;
  }

  const video = document.getElementById('cam-video');
  if(!video){ if(camStream){ camStream.getTracks().forEach(t=>t.stop()); camStream=null; } return; }
  video.srcObject = camStream;
  const st = document.getElementById('cam-status');
  if(st) st.textContent = 'Apunta la cámara al código QR de la credencial.';

  const canvas = document.getElementById('cam-canvas');
  const ctx = canvas.getContext('2d', {willReadFrequently:true});

  function tick(){
    if(!camStream) return;
    const v = document.getElementById('cam-video');
    if(!v){ return; }
    if(v.readyState === v.HAVE_ENOUGH_DATA){
      canvas.width = v.videoWidth; canvas.height = v.videoHeight;
      ctx.drawImage(v, 0, 0, canvas.width, canvas.height);
      try{
        const img = ctx.getImageData(0, 0, canvas.width, canvas.height);
        const code = window.jsQR(img.data, img.width, img.height);
        if(code && code.data){
          const est = findEstudianteByCode(code.data);
          closeModal();
          if(est){
            APP.selected.asistencia = est.id;
            lastMetodo = 'qr';
            renderContent();
            toast('Código escaneado: '+est.nombre, 'success');
          } else {
            toast('El código escaneado no corresponde a ningún estudiante registrado.', 'danger');
          }
          return;
        }
      }catch(e){ /* frame no legible aún, se reintenta */ }
    }
    camRAF = requestAnimationFrame(tick);
  }
  camRAF = requestAnimationFrame(tick);
}
</script>
<script>

      + '<div class="meta">'+fmtTime(ultimo.timestamp)+'</div></div></div>';

function renderRetiros(){

  let html = '<div class="panel">';
  html += '<div class="panel-head"><h2>Buscar estudiante a retirar</h2></div>';

  const bloqueado = sel.restriccionRetiro && !overrideRestriccion;

  if(sel.restriccionRetiro){
    html += '<div class="restriccion-banner">'
      +'<h4>&#9888; Retiro restringido</h4>'
      +'<p><b>Motivo:</b> '+escapeHtml(sel.restriccionMotivo||'No especificado')+'. No entregar al estudiante sin autorización de Dirección/Inspectoría.</p>'
      + (overrideRestriccion
          ? '<span class="badge danger">Autorización de excepción activada para este retiro</span>'
          : (APP.role==='direccion'
              ? '<label class="checkline"><input type="checkbox" id="override-restriccion"> Autorizo esta excepción como Dirección (quedará registrada)</label>'
              : '<div class="alert-box danger" style="margin-top:6px;"><span class="ic">&#128272;</span><div>Solo un usuario con rol <b>Dirección</b> puede autorizar esta excepción. Pide a un directivo que ingrese a esta página y confirme el retiro.</div></div>'))
      +'</div>';
  }

let retiroApoderadoElegido = null;
let sigPadCtx = null, sigPadDrawing = false, sigPadHasStroke = false;

function setupSignaturePad(){
  const canvas = document.getElementById('sigpad');
  if(!canvas) return;
  const ratio = window.devicePixelRatio || 1;
  const rect = canvas.getBoundingClientRect();
  canvas.width = rect.width*ratio;
  canvas.height = rect.height*ratio;
  const ctx = canvas.getContext('2d');
  ctx.scale(ratio,ratio);
  ctx.lineWidth = 2.2;
  ctx.lineCap = 'round';
  ctx.strokeStyle = getComputedStyle(document.documentElement).getPropertyValue('--ink') || '#132033';
  sigPadCtx = ctx; sigPadHasStroke = false;
  let last = null;
  function pos(e){
    const r = canvas.getBoundingClientRect();
    const p = e.touches ? e.touches[0] : e;
    return {x:p.clientX-r.left, y:p.clientY-r.top};
  }
  function start(e){ e.preventDefault(); sigPadDrawing=true; last = pos(e); }
  function move(e){
    if(!sigPadDrawing) return;
    e.preventDefault();
    const p = pos(e);
    ctx.beginPath(); ctx.moveTo(last.x,last.y); ctx.lineTo(p.x,p.y); ctx.stroke();
    last = p; sigPadHasStroke = true;
  }
  function end(){ sigPadDrawing=false; }
  canvas.addEventListener('mousedown', start);
  canvas.addEventListener('mousemove', move);
  window.addEventListener('mouseup', end);
  canvas.addEventListener('touchstart', start, {passive:false});
  canvas.addEventListener('touchmove', move, {passive:false});
  canvas.addEventListener('touchend', end);
  const clearBtn = document.getElementById('sig-clear');
  if(clearBtn) clearBtn.addEventListener('click', ()=>{ ctx.clearRect(0,0,canvas.width,canvas.height); sigPadHasStroke=false; });
}

async function confirmarRetiro(){
  if(!requireFuncionario()) return;
  const sel = APP.estudiantes.find(e=>e.id===APP.selected.retiros);
  if(!sel) return;
  if(sel.restriccionRetiro && overrideRestriccion && APP.role!=='direccion'){
    toast('Solo Dirección puede autorizar una excepción de retiro restringido.', 'danger');
    return;
  }
  const otroToggle = document.getElementById('otro-adulto-toggle');
  let apoderadoNombre, apoderadoRut, esExcepcionAdulto=false;
  if(otroToggle && otroToggle.checked){
    apoderadoNombre = (document.getElementById('otro-nombre').value||'').trim();
    apoderadoRut = normalizeRut(document.getElementById('otro-rut').value);
    const relacion = (document.getElementById('otro-relacion').value||'').trim();
    if(!apoderadoNombre){ toast('Ingresa el nombre de quien retira.', 'danger'); return; }
    apoderadoNombre += relacion ? ' ('+relacion+')' : '';
    esExcepcionAdulto = true;
  } else if(retiroApoderadoElegido){
    apoderadoNombre = retiroApoderadoElegido.nombre;
    apoderadoRut = retiroApoderadoElegido.rut;
  } else {
    toast('Selecciona quién retira al estudiante.', 'danger');
    return;
  }
  const canvas = document.getElementById('sigpad');
  if(!sigPadHasStroke){ toast('Se requiere la firma digital de quien retira.', 'danger'); return; }

  const btn = document.getElementById('confirmar-retiro');
  btn.disabled = true; btn.textContent = 'Guardando…';

  let firmaId = null;
  try{
    const blob = await new Promise(res=>canvas.toBlob(res,'image/png'));
    if(APP.assets && blob){
      const up = await APP.assets.upload(blob, {type:'image/png'});
      firmaId = up.id;
    }
  }catch(e){ console.error(e); }

  const isExcepcionRestriccion = sel.restriccionRetiro && overrideRestriccion;
  const doc = {
    estudianteId: sel.id,
    estudianteNombre: sel.nombre,
    apoderadoNombre, apoderadoRut,
    excepcion: isExcepcionRestriccion || esExcepcionAdulto,
    firmaId,
    funcionario: APP.funcionario,
    timestamp: nowISO(),
    dateKey: todayKey(),
  };
  try{
    if(APP.db){
      await APP.db.collection('retiros').add(doc);
      await APP.db.collection('registros').add({
        estudianteId: sel.id, estudianteNombre: sel.nombre, tipo:'salida', metodo:'retiro',
        funcionario: APP.funcionario, timestamp: nowISO(), dateKey: todayKey(),
      });
      if(isExcepcionRestriccion){
        await crearAlerta('restriccion', 'Retiro con restricción autorizado por excepción: '+sel.nombre+' (retirado por '+apoderadoNombre+')');
      }
      if(esExcepcionAdulto){
        await crearAlerta('retiro', 'Retiro por adulto no registrado: '+sel.nombre+' — '+apoderadoNombre);
      }
    }
    toast('Retiro registrado correctamente.', 'success');
    APP.selected.retiros = null;
    overrideRestriccion = false;
    retiroApoderadoElegido = null;
    renderContent();
  }catch(e){
    console.error(e);
    toast('No se pudo guardar el retiro. Intenta nuevamente.', 'danger');
    btn.disabled = false; btn.textContent = 'Confirmar retiro';
  }
}
</script>

function drawQrInto(elId, text){
  const holder = document.getElementById(elId);
  if(!holder) return;
  try{
    const qr = qrcode(0, 'M');
    qr.addData(text);
    qr.make();
    holder.innerHTML = qr.createSvgTag(4, 4);
  }catch(e){
    holder.innerHTML = '<div style="font-size:11px;color:#888;padding:10px;">No se pudo generar el código</div>';
    console.error(e);
  }
}

async function crearEstudiante(){
  if(APP.role!=='direccion'){ toast('Solo Dirección puede crear fichas de estudiantes.','danger'); return; }
  const nombre = (document.getElementById('ne-nombre').value||'').trim();
  const rut = normalizeRut(document.getElementById('ne-rut').value);
  const curso = (document.getElementById('ne-curso').value||'').trim();
  if(!nombre || !rut){ toast('Ingresa nombre y RUT del estudiante.','danger'); return; }
  const id = rut.replace(/[^A-Za-z0-9\-]/g,'') || uid('est');
  const doc = { nombre, rut, curso, codigo: rut, restriccionRetiro:false, restriccionMotivo:'', apoderados:[], fotoId:null, creado: nowISO() };
  try{
    if(APP.db){ await APP.db.doc('estudiantes/'+id).set(doc); }
    else { APP.estudiantes.push({id,...doc}); }
    toast('Estudiante creado.','success');
    closeModal();

    renderContent();
  }catch(e){ console.error(e); toast('No se pudo crear el estudiante.','danger'); }

  const rut = normalizeRut(document.getElementById('ef-rut').value);
  const curso = (document.getElementById('ef-curso').value||'').trim();

  if(!codigo) codigo = rut;
  const restriccionRetiro = document.getElementById('ef-restriccion').checked;

  const codigoDuplicado = APP.estudiantes.some(e=>e.id!==est.id && (e.codigo||e.rut).toUpperCase()===codigo);

    toast('Ficha actualizada.','success');

/* ======================================================================
   IMPORTACIÓN MASIVA DESDE EXCEL/CSV
   ====================================================================== */
let sheetJsLoading = false;
let importFilas = null;      // filas ya mapeadas a {nombre,rut,curso,codigo,genero}
let importAdvertencias = [];
let importSobrescribir = false;

function loadSheetJS(){
  return new Promise((resolve, reject)=>{
    if(window.XLSX){ resolve(); return; }
    if(sheetJsLoading){
      const check = setInterval(()=>{ if(window.XLSX){ clearInterval(check); resolve(); } }, 100);
      setTimeout(()=>{ clearInterval(check); if(!window.XLSX) reject(new Error('timeout')); }, 10000);
      return;
    }
    sheetJsLoading = true;
    const s = document.createElement('script');
    s.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
    s.onload = ()=> window.XLSX ? resolve() : reject(new Error('XLSX no disponible'));
    s.onerror = ()=> reject(new Error('No se pudo cargar la librería de lectura de Excel'));
    document.head.appendChild(s);
  });
}

function quitarTildes(s){
  return (s||'').toString().normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim();
}

// intenta reconocer las columnas de un archivo de nómina, con o sin acentos,
// y admite tanto "Run"+"Dígito Ver." separados como una columna "RUT" ya formateada.
function detectarColumnas(headerRow){
  const norm = headerRow.map(h=>quitarTildes(h));
  // revisa cada patrón (en orden de especificidad) contra todas las columnas antes de
  // pasar al siguiente patrón, para que un patrón genérico como "grado" no gane
  // por casualidad a una columna más específica que aparece después (ej: "Cod Grado" vs "Desc Grado").
  const find = (preds)=> {
    for(const p of preds){
      for(let i=0;i<norm.length;i++){ if(norm[i].includes(p)) return i; }
    }
    return -1;
  };
  const findCursoUnico = ()=>{
    for(let i=0;i<norm.length;i++){
      if(norm[i].includes('curso') && !norm[i].includes('letra') && !norm[i].includes('grado')) return i;
    }
    return -1;
  };
  return {
    run: find(['run','rut']),
    dv: find(['digito ver','digito verificador','dv']),
    nombres: find(['nombres','nombre']),
    apPaterno: find(['apellido paterno','ap paterno','paterno']),
    apMaterno: find(['apellido materno','ap materno','materno']),
    descGrado: find(['desc grado','descripcion grado','grado']),
    letraCurso: find(['letra curso','letra']),
    cursoUnico: findCursoUnico(),
    genero: find(['genero','sexo']),
  };
}

function abreviarGrado(desc){
  const d = quitarTildes(desc);
  if(d.includes('pre-kinder') || d.includes('pre kinder') || d.includes('1er nivel')) return 'PK';
  if(d.includes('kinder') || d.includes('2do nivel') || d.includes('2 nivel')) return 'K';
  const m = (desc||'').match(/\d+/);
  return m ? m[0] : (desc||'').slice(0,2).toUpperCase();
}
function nombreCursoDesdeAbrev(desc, letra){
  const abbr = abreviarGrado(desc);
  let base;
  if(abbr==='PK') base = 'Prekinder';
  else if(abbr==='K') base = 'Kinder';
  else base = abbr+'°';
  return (base + (letra?(((abbr==='PK'||abbr==='K')?' ':'')+letra):'')).trim();
}
function tituloCase(s){
  return (s||'').toLowerCase().replace(/(^|\s|-)([a-záéíóúñü])/g, (m,sep,c)=> sep+c.toUpperCase());
}

function procesarArchivoImportado(file){
  loadSheetJS().then(()=>{
    const reader = new FileReader();
    reader.onload = (e)=>{
      try{
        const wb = window.XLSX.read(e.target.result, {type:'array'});
        const sheet = wb.Sheets[wb.SheetNames[0]];
        const rows = window.XLSX.utils.sheet_to_json(sheet, {header:1, raw:false, defval:''});
        if(rows.length < 2){ toast('El archivo no tiene filas de datos.','danger'); return; }
        const cols = detectarColumnas(rows[0]);
        if(cols.nombres===-1 || (cols.run===-1 && cols.cursoUnico===-1 && cols.apPaterno===-1)){
          document.getElementById('import-status').innerHTML =
            '<div class="alert-box danger"><span class="ic">&#9888;</span><div>No se reconocieron las columnas del archivo. Asegúrate de tener al menos una columna de nombres y de RUT (por ejemplo: Nombres, Apellido Paterno, Apellido Materno, Run, Dígito Ver.).</div></div>';
          return;
        }

        const abbrevCache = {}; // curso -> contador para código secuencial
        const filas = [];
        const advertencias = [];
        const rutsVistos = {};

        for(let i=1;i<rows.length;i++){
          const r = rows[i];
          if(!r || r.every(c=>c===''||c==null)) continue;

          const nombres = cols.nombres>-1 ? tituloCase(r[cols.nombres]) : '';
          const apPat = cols.apPaterno>-1 ? tituloCase(r[cols.apPaterno]) : '';
          const apMat = cols.apMaterno>-1 ? tituloCase(r[cols.apMaterno]) : '';
          const nombreCompleto = [nombres, apPat, apMat].filter(Boolean).join(' ').trim();
          if(!nombreCompleto){ advertencias.push('Fila '+(i+1)+': sin nombre, se omitió.'); continue; }

          let rut = '';
          if(cols.run>-1){
            const runVal = (r[cols.run]||'').toString().trim();
            const dvVal = cols.dv>-1 ? (r[cols.dv]||'').toString().trim().toUpperCase() : '';
            rut = dvVal ? (runVal+'-'+dvVal) : runVal;
          }
          rut = normalizeRut(rut);
          if(!rut){ advertencias.push('Fila '+(i+1)+' ('+nombreCompleto+'): sin RUT, se omitió.'); continue; }
          if(rutsVistos[rut]){
            advertencias.push('Fila '+(i+1)+' ('+nombreCompleto+'): RUT '+rut+' repetido en el archivo, se omitió esta fila (se mantuvo la primera).');
            continue;
          }
          rutsVistos[rut] = true;

          let curso = '';
          if(cols.cursoUnico>-1){
            curso = (r[cols.cursoUnico]||'').toString().trim();
          } else if(cols.descGrado>-1){
            curso = nombreCursoDesdeAbrev(r[cols.descGrado], cols.letraCurso>-1 ? r[cols.letraCurso] : '');
          }

          const cursoKey = curso || 'Sin curso';
          abbrevCache[cursoKey] = (abbrevCache[cursoKey]||0) + 1;
          let cursoAbrev;
          if(cols.descGrado>-1) cursoAbrev = abreviarGrado(r[cols.descGrado]) + (cols.letraCurso>-1 ? (r[cols.letraCurso]||'').toString().trim() : '');
          else cursoAbrev = (curso||'ST').replace(/[^A-Za-z0-9]/g,'').slice(0,4).toUpperCase() || 'ST';
          const codigo = cursoAbrev+'-'+String(abbrevCache[cursoKey]).padStart(2,'0');

          const genero = cols.genero>-1 ? (r[cols.genero]||'').toString().trim().toUpperCase().slice(0,1) : '';

          filas.push({ nombre: nombreCompleto, rut, curso, codigo, genero });
        }

        importFilas = filas;
        importAdvertencias = advertencias;
        renderImportPreview();
      }catch(err){
        console.error(err);
        const st = document.getElementById('import-status');
        if(st) st.innerHTML = '<div class="alert-box danger"><span class="ic">&#9888;</span><div>No se pudo leer el archivo. Verifica que sea un Excel (.xlsx) o CSV válido.</div></div>';
      }
    };
    reader.readAsArrayBuffer(file);
  }).catch(()=>{
    const st = document.getElementById('import-status');
    if(st) st.innerHTML = '<div class="alert-box danger"><span class="ic">&#9888;</span><div>No se pudo cargar el lector de Excel. Verifica tu conexión a internet e inténtalo de nuevo.</div></div>';
  });
}

function renderImportPreview(){
  const st = document.getElementById('import-status');
  if(!st) return;
  if(!importFilas || importFilas.length===0){
    st.innerHTML = '<div class="alert-box warn"><span class="ic">&#9888;</span><div>No se encontraron estudiantes válidos para importar en este archivo.</div></div>';
    return;
  }
  const existentesRuts = new Set(APP.estudiantes.map(e=>normalizeRut(e.rut)));
  const nuevos = importFilas.filter(f=>!existentesRuts.has(f.rut));
  const yaExisten = importFilas.filter(f=>existentesRuts.has(f.rut));

  let html = '<div class="alert-box navy"><span class="ic">&#128203;</span><div>'
    + '<b>'+importFilas.length+'</b> estudiantes reconocidos en el archivo. '
    + '<b>'+nuevos.length+'</b> son nuevos y se crearán. '
    + (yaExisten.length ? '<b>'+yaExisten.length+'</b> ya existen (mismo RUT) y '+(importSobrescribir?'se sobrescribirán.':'se omitirán, a menos que actives la opción de abajo.') : '')
    + '</div></div>';

  if(importAdvertencias.length){
    html += '<div class="alert-box warn"><span class="ic">&#9888;</span><div>'+importAdvertencias.length+' fila(s) con observaciones:<br>'
      + importAdvertencias.slice(0,8).map(a=>escapeHtml(a)).join('<br>')
      + (importAdvertencias.length>8 ? '<br>… y '+(importAdvertencias.length-8)+' más.' : '')
      + '</div></div>';
  }

  if(yaExisten.length){
    html += '<label class="checkline" style="margin-bottom:10px;"><input type="checkbox" id="import-sobrescribir" '+(importSobrescribir?'checked':'')+'> Sobrescribir los '+yaExisten.length+' estudiantes que ya existen con el mismo RUT (se reemplazará nombre, curso y código; no afecta apoderados ya cargados)</label>';
  }

  html += '<div class="table-wrap" style="max-height:260px;overflow-y:auto;border:1px solid var(--line);border-radius:var(--radius-sm);">'
    +'<table class="data"><thead><tr><th>Nombre</th><th>RUT</th><th>Curso</th><th>Código</th></tr></thead><tbody>'
    + importFilas.slice(0,25).map(f=>'<tr><td>'+escapeHtml(f.nombre)+'</td><td class="rut">'+escapeHtml(f.rut)+'</td><td>'+escapeHtml(f.curso||'Sin curso')+'</td><td class="rut">'+escapeHtml(f.codigo)+'</td></tr>').join('')
    + '</tbody></table></div>';
  if(importFilas.length>25) html += '<p class="help-note">Mostrando los primeros 25 de '+importFilas.length+' registros.</p>';

  html += '<button class="btn orange block" id="confirmar-importar" style="margin-top:12px;">Importar '+(importSobrescribir?importFilas.length:nuevos.length)+' estudiante(s)</button>';
  html += '<div id="import-progress" class="help-note" style="margin-top:8px;"></div>';

  st.innerHTML = html;

  const chk = document.getElementById('import-sobrescribir');
  if(chk) chk.addEventListener('change', ()=>{ importSobrescribir = chk.checked; renderImportPreview(); });
  const confirmBtn = document.getElementById('confirmar-importar');
  if(confirmBtn) confirmBtn.addEventListener('click', confirmarImportacion);
}

async function confirmarImportacion(){
  if(APP.role!=='direccion'){ toast('Solo Dirección puede importar estudiantes.','danger'); return; }
  if(!importFilas || !APP.db) return;
  const existentesRuts = new Set(APP.estudiantes.map(e=>normalizeRut(e.rut)));
  const aImportar = importSobrescribir ? importFilas : importFilas.filter(f=>!existentesRuts.has(f.rut));
  if(aImportar.length===0){ toast('No hay estudiantes nuevos que importar.','danger'); return; }

  const btn = document.getElementById('confirmar-importar');
  if(btn){ btn.disabled = true; btn.textContent = 'Importando…'; }
  const progress = document.getElementById('import-progress');

  const CONCURRENCIA = 15;
  let hechos = 0, errores = 0;
  for(let i=0;i<aImportar.length;i+=CONCURRENCIA){
    const lote = aImportar.slice(i, i+CONCURRENCIA);
    await Promise.all(lote.map(async (f)=>{
      const id = f.rut.replace(/[^A-Za-z0-9\-]/g,'') || uid('est');
      try{
        await APP.db.doc('estudiantes/'+id).set({
          nombre: f.nombre, rut: f.rut, curso: f.curso||'', codigo: f.codigo,
          genero: f.genero||'', restriccionRetiro:false, restriccionMotivo:'', apoderados:[], fotoId:null,
          creado: nowISO(),
        });
        hechos++;
      }catch(e){ console.error(e); errores++; }
    }));
    if(progress) progress.textContent = 'Importando… '+Math.min(i+CONCURRENCIA, aImportar.length)+' / '+aImportar.length;
  }

  toast('Importación completa: '+hechos+' estudiantes cargados'+(errores?(', '+errores+' con error'):'')+'.', errores?'danger':'success');
  importFilas = null; importAdvertencias = []; importSobrescribir = false;
  closeModal();
}

function modalImportar(){
  openModal(
    '<h3>Importar estudiantes desde Excel/CSV</h3>'
    +'<p class="help-note">Funciona con nóminas tipo SIGE/Mineduc (columnas Run, Dígito Ver., Nombres, Apellido Paterno, Apellido Materno, Desc Grado, Letra Curso) o con un archivo simple con columnas Nombre, RUT y Curso. El código de credencial se genera automáticamente por curso (ej: 4A-01); podrás cambiarlo después en cada ficha.</p>'
    +'<div class="field"><input type="file" id="import-file" accept=".xlsx,.xls,.csv"></div>'
    +'<div id="import-status"></div>'
    +'<div class="modal-actions"><button class="btn ghost" id="import-cerrar">Cerrar</button></div>'
  );
  importFilas = null; importAdvertencias = []; importSobrescribir = false;
  document.getElementById('import-cerrar').addEventListener('click', closeModal);
  document.getElementById('import-file').addEventListener('change', (e)=>{
    const f = e.target.files[0];
    if(!f) return;
    document.getElementById('import-status').innerHTML = '<p class="help-note">Leyendo archivo…</p>';
    procesarArchivoImportado(f);
  });
}

function modalEliminarTodos(){
  if(APP.role!=='direccion'){ toast('Solo Dirección puede eliminar estudiantes.','danger'); return; }
  const n = APP.estudiantes.length;
  openModal(
    '<h3 style="color:var(--danger);">Eliminar todos los estudiantes</h3>'
    +'<div class="alert-box danger"><span class="ic">&#9888;</span><div>Se eliminarán las <b>'+n+'</b> fichas con sus apoderados y restricciones de retiro. Esta acción <b>no se puede deshacer</b>.</div></div>'
    +'<p class="help-note">El historial (asistencia, retiros, atrasos y visitas) no se borra: conserva el nombre del estudiante tal como quedó registrado. Después puedes importar la nueva nómina del año.</p>'
    +'<div style="margin:12px 0;"><button class="btn ghost sm" id="elim-respaldo">Descargar respaldo de estudiantes (CSV) antes de borrar</button></div>'
    +'<div class="field"><label>Para confirmar, escribe ELIMINAR</label><input type="text" id="elim-confirm" autocomplete="off"></div>'
    +'<div id="elim-progress" class="help-note"></div>'
    +'<div class="modal-actions"><button class="btn ghost" id="elim-cancelar">Cancelar</button><button class="btn danger" id="elim-ejecutar" disabled>Eliminar '+n+' estudiantes</button></div>'
  );
  document.getElementById('elim-cancelar').addEventListener('click', closeModal);
  document.getElementById('elim-respaldo').addEventListener('click', ()=>exportarCsv('estudiantes'));
  const input = document.getElementById('elim-confirm');
  const btn = document.getElementById('elim-ejecutar');
  input.addEventListener('input', ()=>{ btn.disabled = input.value.trim().toUpperCase()!=='ELIMINAR'; });
  btn.addEventListener('click', eliminarTodosEstudiantes);
}

async function eliminarTodosEstudiantes(){
  if(APP.role!=='direccion'){ toast('Solo Dirección puede eliminar estudiantes.','danger'); return; }
  if(!APP.db) return;
  const ids = APP.estudiantes.map(e=>e.id);
  const btn = document.getElementById('elim-ejecutar');
  const cancel = document.getElementById('elim-cancelar');
  const progress = document.getElementById('elim-progress');
  if(btn){ btn.disabled = true; btn.textContent = 'Eliminando…'; }
  if(cancel) cancel.disabled = true;

  const CONCURRENCIA = 15;
  let hechos = 0, errores = 0;
  for(let i=0;i<ids.length;i+=CONCURRENCIA){
    const lote = ids.slice(i, i+CONCURRENCIA);
    await Promise.all(lote.map(async (id)=>{
      try{ await APP.db.doc('estudiantes/'+id).delete(); hechos++; }
      catch(e){ console.error(e); errores++; }
    }));
    if(progress) progress.textContent = 'Eliminando… '+Math.min(i+CONCURRENCIA, ids.length)+' / '+ids.length;
  }
  estudianteAbiertoId = null;
  APP.selected = { asistencia:null, retiros:null, atrasos:null };
  toast(errores ? ('Se eliminaron '+hechos+' estudiantes; '+errores+' fallaron, reintenta.') : ('Se eliminaron '+hechos+' estudiantes.'), errores?'danger':'success');
  closeModal();
}

<script>
/* ======================================================================
   MÓDULO: REPORTES Y EXPORTACIÓN (solo rol Dirección)
   ====================================================================== */
let reporteRango = 'hoy';
let reporteInicio = todayKey();
let reporteFin = todayKey();
let reporteData = null;
let reporteCargando = false;

function renderReportes(){
  if(APP.role!=='direccion'){
    return '<div class="panel"><div class="empty-state">'
      +'<div class="ic">&#128274;</div>'
      +'<h3 style="margin:0 0 4px;font-family:var(--font-head);">Acceso restringido a Dirección</h3>'
      +'<p>Los reportes agregados y la exportación de respaldo están reservados al rol Dirección para resguardar los datos de estudiantes y apoderados.<br>Si necesitas acceso, pide al administrador de esta página que te asigne "Puede editar" desde el botón Compartir.</p>'
      +'</div></div>';
  }

  let html = '<div class="panel">';
  html += '<div class="panel-head"><h2>Generar reporte</h2><span class="hint">Consulta agregada por rango de fechas</span></div>';
  html += '<div class="field"><label>Rango de fechas</label><div class="pill-select">'
    + rangoPill('hoy','Hoy') + rangoPill('semana','Últimos 7 días') + rangoPill('mes','Este mes') + rangoPill('personalizado','Personalizado')
    + '</div></div>';
  if(reporteRango==='personalizado'){
    html += '<div class="grid-2"><div class="field"><label>Desde</label><input type="date" id="rep-desde" value="'+reporteInicio+'"></div>'
      +'<div class="field"><label>Hasta</label><input type="date" id="rep-hasta" value="'+reporteFin+'"></div></div>';
  }
  html += '<button class="btn navy" id="generar-reporte" '+(reporteCargando?'disabled':'')+'>'+(reporteCargando?'Generando…':'Generar reporte')+'</button>';
  html += '</div>';

  if(reporteData){
    const d = reporteData;
    const rangoLabel = reporteInicio===reporteFin ? reporteInicio : (reporteInicio+' a '+reporteFin);
    html += '<div class="grid-3" style="margin-bottom:16px;">'
      + statCard(d.registros.filter(r=>r.tipo==='entrada').length,'Entradas','')
      + statCard(d.registros.filter(r=>r.tipo==='salida').length,'Salidas','')
      + statCard(d.retiros.length,'Retiros anticipados','orange')
      + statCard(d.retiros.filter(r=>r.excepcion).length,'Retiros por excepción','danger')
      + statCard(d.atrasos.length,'Atrasos','warn')
      + statCard(d.atrasos.filter(a=>!a.justificado).length,'Atrasos sin justificar','danger')
      + statCard(d.visitas.length,'Visitas registradas','navy')
      +'</div>';

    html += '<div class="panel">';
    html += '<div class="panel-head"><h2>Respaldo y exportación</h2><span class="hint">Periodo: '+escapeHtml(rangoLabel)+'</span></div>';
    html += '<p class="help-note">Esta página no puede sincronizarse en vivo con Google Sheets: el navegador bloquea, por seguridad, que una página descargue o suba datos a servicios externos por su cuenta. El camino confiable es descargar el respaldo en CSV aquí y, en Google Sheets, usar <b>Archivo → Importar → Subir</b> (o abrirlo directamente en Excel). Toma menos de un minuto y deja todo el detalle disponible para análisis o respaldo histórico.</p>';
    html += '<div style="display:flex;gap:8px;flex-wrap:wrap;">'
      +'<button class="btn ghost sm" data-action="exportar" data-tipo="registros">Asistencia (CSV)</button>'
      +'<button class="btn ghost sm" data-action="exportar" data-tipo="retiros">Retiros (CSV)</button>'
      +'<button class="btn ghost sm" data-action="exportar" data-tipo="atrasos">Atrasos (CSV)</button>'
      +'<button class="btn ghost sm" data-action="exportar" data-tipo="visitas">Visitas (CSV)</button>'
      +'<button class="btn ghost sm" data-action="exportar" data-tipo="estudiantes">Estudiantes y apoderados (CSV)</button>'
      +'<button class="btn orange sm" data-action="exportar" data-tipo="todo">Descargar todo combinado</button>'
      +'</div></div>';

    html += '<div class="grid-2">';
    html += '<div class="panel"><div class="panel-head"><h2>Atrasos por motivo</h2></div>' + tablaConteo(groupCount(d.atrasos,'motivo')) + '</div>';
    html += '<div class="panel"><div class="panel-head"><h2>Visitas por motivo</h2></div>' + tablaConteo(groupCount(d.visitas,'motivo')) + '</div>';
    html += '</div>';

    html += '<div class="panel"><div class="panel-head"><h2>Detalle de atrasos sin justificar</h2></div>';
    const sinJustificar = d.atrasos.filter(a=>!a.justificado);
    if(sinJustificar.length===0){
      html += '<div class="help-note">No hay atrasos sin justificar en este periodo.</div>';
    } else {
      html += '<div class="table-wrap"><table class="data"><thead><tr><th>Fecha</th><th>Estudiante</th><th>Curso</th><th>Motivo</th></tr></thead><tbody>'
        + sinJustificar.map(a=>'<tr><td>'+fmtDateTime(a.timestamp)+'</td><td>'+escapeHtml(a.estudianteNombre)+'</td><td>'+escapeHtml(a.curso||'')+'</td><td>'+escapeHtml(a.motivo)+'</td></tr>').join('')
        + '</tbody></table></div>';
    }
    html += '</div>';
  }

  return html;
}

function rangoPill(value,label){
  return '<div class="pill'+(value===reporteRango?' active':'')+'" data-rango-value="'+value+'">'+escapeHtml(label)+'</div>';
}

function groupCount(arr, field){
  const counts = {};
  arr.forEach(x=>{ const k=x[field]||'Sin especificar'; counts[k]=(counts[k]||0)+1; });
  return Object.entries(counts).sort((a,b)=>b[1]-a[1]);
}
function tablaConteo(pairs){
  if(pairs.length===0) return '<div class="help-note">Sin datos en el rango seleccionado.</div>';
  return '<table class="data"><tbody>'+pairs.map(([k,v])=>'<tr><td>'+escapeHtml(k)+'</td><td style="text-align:right;font-weight:700;">'+v+'</td></tr>').join('')+'</tbody></table>';
}

function addDaysKey(baseDate, delta){
  const d = new Date(baseDate);
  d.setDate(d.getDate()+delta);
  return todayKey(d);
}

async function fetchRange(coll, startKey, endKey){
  let q = APP.db.collection(coll).where('dateKey','>=',startKey).where('dateKey','<=',endKey).limit(1000);
  const snap = await q.get();
  return snap.docs.map(x=>({id:x.id, ...x.data()}));
}

async function generarReporte(){
  if(APP.role!=='direccion' || !APP.db) return;
  const today = todayKey();
  let startKey, endKey;
  if(reporteRango==='hoy'){ startKey=today; endKey=today; }
  else if(reporteRango==='semana'){ startKey=addDaysKey(new Date(),-6); endKey=today; }
  else if(reporteRango==='mes'){ const d=new Date(); d.setDate(1); startKey=todayKey(d); endKey=today; }
  else {
    const dEl = document.getElementById('rep-desde'), hEl = document.getElementById('rep-hasta');
    startKey = (dEl && dEl.value) || today;
    endKey = (hEl && hEl.value) || today;
    if(startKey > endKey){ const t=startKey; startKey=endKey; endKey=t; }
  }
  reporteInicio = startKey; reporteFin = endKey;
  reporteCargando = true; renderContent();
  try{
    const [registros, retiros, atrasos, visitas] = await Promise.all([
      fetchRange('registros', startKey, endKey),
      fetchRange('retiros', startKey, endKey),
      fetchRange('atrasos', startKey, endKey),
      fetchRange('visitas', startKey, endKey),
    ]);
    reporteData = {registros, retiros, atrasos, visitas};
    toast('Reporte generado.', 'success');
  }catch(e){
    console.error(e);
    toast('No se pudo generar el reporte. Intenta con un rango más acotado.', 'danger');
  }
  reporteCargando = false;
  renderContent();
}

function toCsv(rows, headers){
  const esc = v => '"'+String(v==null?'':v).replace(/"/g,'""')+'"';
  const lines = [headers.map(esc).join(',')];
  rows.forEach(r=>lines.push(headers.map(h=>esc(r[h])).join(',')));
  return lines.join('\r\n');
}

function estudiantesToRows(){
  const rows = [];
  APP.estudiantes.forEach(e=>{
    if(!e.apoderados || e.apoderados.length===0){
      rows.push({estudiante:e.nombre, rutEstudiante:e.rut, curso:e.curso, restriccion:e.restriccionRetiro?'SI':'NO', motivoRestriccion:e.restriccionMotivo||'', apoderado:'', rutApoderado:'', parentesco:'', telefono:''});
    } else {
      e.apoderados.forEach(ap=>rows.push({
        estudiante:e.nombre, rutEstudiante:e.rut, curso:e.curso, restriccion:e.restriccionRetiro?'SI':'NO', motivoRestriccion:e.restriccionMotivo||'',
        apoderado:ap.nombre, rutApoderado:ap.rut, parentesco:ap.parentesco||'', telefono:ap.telefono||'',
      }));
    }
  });
  return rows;
}

async function exportarCsv(tipo){
  if(!reporteData && tipo!=='estudiantes'){ toast('Genera el reporte primero.','danger'); return; }
  if(!APP.downloads){ toast('La descarga de archivos no está disponible en esta vista.','danger'); return; }
  const rango = reporteInicio===reporteFin ? reporteInicio : (reporteInicio+'_a_'+reporteFin);
  let filename, content;

  const HEAD = {
    registros: ['timestamp','estudianteNombre','tipo','metodo','funcionario'],
    retiros: ['timestamp','estudianteNombre','apoderadoNombre','apoderadoRut','excepcion','funcionario'],
    atrasos: ['timestamp','estudianteNombre','curso','motivo','origen','justificado','folio','funcionario'],
    visitas: ['horaEntrada','horaSalida','nombre','rut','motivo','destino','funcionario'],
    estudiantes: ['estudiante','rutEstudiante','curso','restriccion','motivoRestriccion','apoderado','rutApoderado','parentesco','telefono'],
  };

  if(tipo==='estudiantes'){
    content = toCsv(estudiantesToRows(), HEAD.estudiantes);
    filename = 'estudiantes_y_apoderados.csv';
  } else if(tipo==='todo'){
    content = '=== ASISTENCIA ('+rango+') ===\r\n' + toCsv(reporteData.registros, HEAD.registros)
      + '\r\n\r\n=== RETIROS ===\r\n' + toCsv(reporteData.retiros, HEAD.retiros)
      + '\r\n\r\n=== ATRASOS ===\r\n' + toCsv(reporteData.atrasos, HEAD.atrasos)
      + '\r\n\r\n=== VISITAS ===\r\n' + toCsv(reporteData.visitas, HEAD.visitas)
      + '\r\n\r\n=== ESTUDIANTES Y APODERADOS ===\r\n' + toCsv(estudiantesToRows(), HEAD.estudiantes);
    filename = 'respaldo_pasoseguro_'+rango+'.csv';
  } else {
    content = toCsv(reporteData[tipo], HEAD[tipo]);
    filename = tipo+'_'+rango+'.csv';
  }

  try{
    await APP.downloads.save({filename, data: content});
    toast('Archivo descargado. Impórtalo en Google Sheets con Archivo → Importar.', 'success');
  }catch(e){
    if(e && e.code==='declined'){ /* el usuario canceló, sin aviso */ }
    else { console.error(e); toast('No se pudo generar la descarga.','danger'); }
  }
}

function matRellenarApoderados(){
 const campos=['nombre','rut','domicilio','fono'],tit=[],sup=[];
 ['padre','madre'].forEach(p=>{if(!(MAT[p+'_nombre']||'').trim())return;if(MAT[p+'_rol']==='Titular')tit.push(p);else if(MAT[p+'_rol']==='Suplente')sup.push(p);});
 if(!tit.length&&!sup.length){toast('Primero ingresa los datos del padre o la madre y elige su rol (Titular o Suplente).','danger');return;}
 const copiar=(de,a)=>campos.forEach(f=>{MAT[a+'_'+f]=MAT[de+'_'+f]||'';});
 if(tit[0])copiar(tit[0],'tit');
 sup.slice(0,2).forEach((p,i)=>copiar(p,'sup'+(i+1)));

}

function matCodigo(curso){
 const ab=curso.indexOf('Prekinder')===0?'PK':curso.indexOf('Kinder')===0?'K':(curso.match(/\d+/)||['X'])[0];
 const base=ab+((curso.match(/[A-Z]$/)||[''])[0]);let n=1;
 while(APP.estudiantes.some(e=>e.codigo===base+'-'+String(n).padStart(2,'0')))n++;

}

 const nombre=m.nombres.trim()+' '+m.apellidos.trim(),genero=m.sexo==='Femenino'?'F':m.sexo==='Masculino'?'M':'';

 [['tit','Apoderado titular'],['sup1','Apoderado suplente 1'],['sup2','Apoderado suplente 2'],['padre','Padre'],['madre','Madre']].forEach(p=>{
  const n=(m[p[0]+'_nombre']||'').trim();if(!n||vistos[n])return;vistos[n]=1;
  const r=normalizeRut(m[p[0]+'_rut']),old=prev.find(a=>(r&&normalizeRut(a.rut)===r)||a.nombre===n);
  ap.push({nombre:n,rut:r,telefono:m[p[0]+'_fono']||'',parentesco:p[1],fotoId:old&&old.fotoId||null});});
 const apoderados=ap.length?ap:prev;

  else await APP.db.doc('estudiantes/'+id).set({nombre,rut,curso:m.curso,codigo:matCodigo(m.curso),genero,restriccionRetiro:false,restriccionMotivo:'',apoderados,fotoId:null,creado:nowISO(),matricula:data});

}

/* ======================================================================
   EVENTOS POR RUTA (re-atados en cada render)
   ====================================================================== */
function wireRouteEvents(){
  const content = document.getElementById('content');

  // Delegación general de data-action dentro del contenido
  content.addEventListener('click', onContentClick);

  if(APP.route==='inicio'){
    // nada adicional
  }

  if(APP.route==='asistencia'){
    const scan = document.getElementById('scan-input');
    if(scan){
      scan.focus();
      scan.addEventListener('keydown', (e)=>{
        if(e.key==='Enter'){
          const code = scan.value.trim();
          scan.value='';
          if(!code) return;
          const est = findEstudianteByCode(code);
          if(est){
            APP.selected.asistencia = est.id;
            lastMetodo = 'qr';
            renderContent();
          } else {
            toast('No se encontró ningún estudiante con ese código o RUT.', 'danger');
          }
        }
      });
    }
    const search = document.getElementById('asistencia-search');
    if(search){
      search.addEventListener('input', ()=>{
        document.getElementById('asistencia-results').innerHTML = renderSearchResults(matchEstudiante(search.value), 'asistencia');
      });
    }
    const camBtn = document.getElementById('btn-cam-scan');
    if(camBtn) camBtn.addEventListener('click', abrirEscanerCamara);
  }

  if(APP.route==='retiros'){
    const search = document.getElementById('retiros-search');
    if(search){
      search.addEventListener('input', ()=>{
        document.getElementById('retiros-results').innerHTML = renderSearchResults(matchEstudiante(search.value), 'retiros');
      });
    }
    const otroToggle = document.getElementById('otro-adulto-toggle');
    if(otroToggle){
      otroToggle.addEventListener('change', ()=>{
        document.getElementById('otro-adulto-form').style.display = otroToggle.checked ? 'block' : 'none';
        document.getElementById('apoderado-elegido').style.display='none';
        if(otroToggle.checked) retiroApoderadoElegido = null;
      });
    }
    const overrideBox = document.getElementById('override-restriccion');
    if(overrideBox){
      overrideBox.addEventListener('change', ()=>{ overrideRestriccion = overrideBox.checked; renderContent(); });
    }
    const confirmarBtn = document.getElementById('confirmar-retiro');
    if(confirmarBtn) confirmarBtn.addEventListener('click', confirmarRetiro);
    setupSignaturePad();
  }

  if(APP.route==='atrasos'){
    const search = document.getElementById('atrasos-search');
    if(search){
      search.addEventListener('input', ()=>{
        document.getElementById('atrasos-results').innerHTML = renderSearchResults(matchEstudiante(search.value), 'atrasos');
      });
    }
    const genBtn = document.getElementById('generar-ticket');
    if(genBtn) genBtn.addEventListener('click', generarTicketAtraso);
  }

  if(APP.route==='visitas'){
    const regBtn = document.getElementById('registrar-visita');
    if(regBtn) regBtn.addEventListener('click', registrarVisita);
    const fotoInput = document.getElementById('visita-foto-input');
    if(fotoInput){
      fotoInput.addEventListener('change', (e)=>{
        const f = e.target.files[0]; if(!f) return;
        visitaFotoPendiente = f;
        const prev = document.getElementById('visita-foto-preview');
        prev.src = URL.createObjectURL(f); prev.style.display='block';
      });
    }
  }

  if(APP.route==='estudiantes'){
    const search = document.getElementById('estudiantes-search');
    if(search){
      search.addEventListener('input', ()=>{
        const q = search.value.trim().toLowerCase();
        const filtered = !q ? APP.estudiantes : APP.estudiantes.filter(e=>
          (e.nombre||'').toLowerCase().includes(q) || normalizeRut(e.rut).toLowerCase().includes(q.replace(/\./g,'')) || (e.curso||'').toLowerCase().includes(q));
        document.getElementById('estudiantes-list').innerHTML = filtered.length ? filtered.map(renderEstudianteRow).join('') : '<div class="empty-state"><p>Sin resultados.</p></div>';
      });
    }
    const efRestriccion = document.getElementById('ef-restriccion');
    if(efRestriccion){
      efRestriccion.addEventListener('change', ()=>{
        document.getElementById('ef-motivo-wrap').style.display = efRestriccion.checked ? 'block' : 'none';
      });
    }
    const guardarBtn = document.getElementById('guardar-ficha');
    if(guardarBtn) guardarBtn.addEventListener('click', guardarFicha);
    const elimBtn = document.getElementById('eliminar-estudiante');
    if(elimBtn) elimBtn.addEventListener('click', eliminarEstudiante);
    const agregarApBtn = document.getElementById('agregar-apoderado');
    if(agregarApBtn) agregarApBtn.addEventListener('click', modalAgregarApoderado);

    if(estudianteAbiertoId){

      if(est) drawQrInto('qr-holder', est.codigo || est.rut);

  if(APP.route==='matricula') wireMatricula();

  if(APP.route==='reportes'){
    const genBtn = document.getElementById('generar-reporte');
    if(genBtn) genBtn.addEventListener('click', generarReporte);
  }
}

let lastMetodo = 'manual';

function onContentClick(e){
  const el = e.target.closest('[data-action]');
  if(!el) return;
  const action = el.dataset.action;

  if(action==='select-estudiante'){
    const mod = el.dataset.mod;
    APP.selected[mod] = el.dataset.id;
    if(mod==='retiros'){ overrideRestriccion=false; retiroApoderadoElegido=null; }
    if(mod==='atrasos'){ ultimoTicket=null; }
    renderContent();
  }
  else if(action==='clear-selected'){
    APP.selected[el.dataset.mod] = null;
    renderContent();
  }
  else if(action==='marcar-entrada' || action==='marcar-salida'){
    registrarAsistencia(el.dataset.id, action==='marcar-entrada'?'entrada':'salida');
  }
  else if(action==='marcar-leida'){
    marcarAlertaLeida(el.dataset.id);
  }
  else if(action==='select-apoderado'){
    const sel = APP.estudiantes.find(e=>e.id===APP.selected.retiros);
    const ap = sel.apoderados[parseInt(el.dataset.idx,10)];
    retiroApoderadoElegido = ap;
    const box = document.getElementById('apoderado-elegido');
    box.style.display='flex';
    box.innerHTML = '<span class="ic">&#10003;</span><div>Retira: <b>'+escapeHtml(ap.nombre)+'</b> ('+escapeHtml(ap.parentesco||'Apoderado/a')+') — verifica su RUT <span style="font-family:var(--mono);">'+escapeHtml(ap.rut)+'</span> contra su cédula.</div>';
  }
  else if(action==='imprimir-ticket'){
    imprimirTicket(el.dataset.folio);
  }
  else if(action==='registrar-salida-visita'){
    registrarSalidaVisita(el.dataset.id);
  }
  else if(action==='nuevo-estudiante'){
    modalNuevoEstudiante();
  }
  else if(action==='seed-demo'){
    seedDemoData();
  }
  else if(action==='abrir-lote-credenciales'){
    modalLoteCredenciales();
  }
  else if(action==='abrir-importar'){
    modalImportar();
  }
  else if(action==='abrir-eliminar-todos'){
    modalEliminarTodos();
  }
  else if(action==='go-estudiantes'){
    navigate('estudiantes');
  }
  else if(action==='abrir-ficha'){
    estudianteAbiertoId = el.dataset.id;
    renderContent();
    setTimeout(()=>{ document.getElementById('ficha-detalle')?.scrollIntoView({behavior:'smooth', block:'start'}); }, 30);
  }
  else if(action==='cerrar-ficha'){
    estudianteAbiertoId = null;
    renderContent();
  }
  else if(action==='eliminar-apoderado'){
    eliminarApoderado(parseInt(el.dataset.idx,10));
  }
  else if(action==='imprimir-credencial'){
    imprimirCredencial();
  }
  else if(action==='exportar'){
    exportarCsv(el.dataset.tipo);
  }

  // rango de fechas del reporte
  const rangoEl = e.target.closest('[data-rango-value]');
  if(rangoEl){
    reporteRango = rangoEl.dataset.rangoValue;
    renderContent();
    return;
  }

  // pills de selección (motivo / origen de atraso, motivo de visita)
  const pillValueEl = e.target.closest('[data-pill-value]');
  if(pillValueEl){
    const label = pillValueEl.closest('.field').querySelector('label').textContent;
    const val = pillValueEl.dataset.pillValue;
    if(label.includes('Origen')) atrasoOrigenSel = val;
    else if(label.includes('Motivo')) atrasoMotivoSel = val;
    renderContent();
    return;
  }
  const pillVisitaEl = e.target.closest('[data-pill-visita]');
  if(pillVisitaEl){
    visitaMotivoSel = pillVisitaEl.dataset.pillVisita;
    renderContent();
    return;
  }
}

async function registrarAsistencia(estId, tipo){
  if(!requireFuncionario()) return;
  const est = APP.estudiantes.find(e=>e.id===estId);
  if(!est) return;
  const metodo = lastMetodo; lastMetodo='manual';
  try{
    if(APP.db){
      await APP.db.collection('registros').add({
        estudianteId: est.id, estudianteNombre: est.nombre, tipo, metodo,
        funcionario: APP.funcionario, timestamp: nowISO(), dateKey: todayKey(),
      });
      if(tipo==='entrada'){
        const hhmm = new Date().toTimeString().slice(0,5);
        if(hhmm > HORARIO_ENTRADA_LIMITE){
          toast(est.nombre+' registrado con atraso ('+hhmm+'). Considera generar un ticket de atraso.', 'danger');
        }
      }
    }
    toast((tipo==='entrada'?'Entrada':'Salida')+' registrada para '+est.nombre, 'success');
    APP.selected.asistencia = null;
    renderContent();
  }catch(e){ console.error(e); toast('No se pudo registrar el movimiento.','danger'); }
}
